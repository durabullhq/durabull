name: UI catalog
on:
  pull_request:
    paths:
      - 'apps/storybook/**'
      - 'apps/web/src/**'
      - 'apps/web/public/**'
      - 'apps/docs/src/**'
      - 'apps/docs/app/**'
      - 'apps/docs/public/**'
      - 'apps/docs/tooling/**'
      - 'apps/docs/package.json'
      - 'apps/docs/turbo.json'
      - 'packages/mcp/**'
      - 'packages/email/**'
      - 'packages/auth/**'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - '.github/workflows/storybook.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/storybook typecheck
      - run: bun run --cwd apps/storybook lint
      - run: bun run --cwd apps/storybook format:check
      - run: bun run --cwd apps/storybook test
      - run: bun run build:storybook
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/storybook
      - run: bun run --cwd apps/storybook test:browser
      - run: bun run build:docs
      - run: bun run --cwd apps/storybook test:hosting
      - uses: actions/upload-artifact@v4
        with:
          name: durabull-ui-catalog
          path: apps/storybook/dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-catalog-test-results
          path: |
            apps/storybook/test-results
            apps/storybook/playwright-report
