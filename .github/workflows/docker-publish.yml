name: Docker Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Publish Image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./tooling/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Validate Render secrets
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret must be configured."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for image availability in GHCR
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          IMAGE_REPOSITORY="${REPOSITORY,,}"
          IMAGE_TAG="ghcr.io/${IMAGE_REPOSITORY}:${REF_NAME}"
          IMAGE_LATEST="ghcr.io/${IMAGE_REPOSITORY}:latest"

          for image in "$IMAGE_TAG" "$IMAGE_LATEST"; do
            echo "Checking availability for $image"
            for attempt in {1..20}; do
              if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
                echo "$image is available."
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                echo "Timed out waiting for $image."
                exit 1
              fi
              echo "Waiting for $image to be available ($attempt/20)..."
              sleep 15
            done
          done

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
