name: Desktop Builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  BUN_VERSION: "1.3.5"

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release metadata
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "DURABULL_APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "DURABULL_BUILD_ID=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "DURABULL_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "DURABULL_RELEASE_CHANNEL=desktop" >> "$GITHUB_ENV"

      - name: Build native release artifacts
        if: github.event_name == 'push'
        run: bun run dist:desktop

      - name: Generate macOS SHA256 verification file
        if: github.event_name == 'push' && runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          dmg_assets=(apps/desktop/release/Durabull-*-arm64.dmg)

          if [ ${#dmg_assets[@]} -ne 1 ]; then
            echo "Expected one macOS arm64 DMG, found ${#dmg_assets[@]}." >&2
            printf '%s\n' "${dmg_assets[@]}" >&2
            exit 1
          fi

          dmg="${dmg_assets[0]}"
          checksum_file="apps/desktop/release/durabull-macos-arm64.sha256"

          (
            cd "$(dirname "$dmg")"
            shasum -a 256 "$(basename "$dmg")" > "$(basename "$checksum_file")"
          )

          echo "Wrote $checksum_file"

      - name: Wait for GitHub release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in {1..24}; do
            if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              exit 0
            fi

            sleep 5
          done

          echo "GitHub release ${GITHUB_REF_NAME} was not available in time." >&2
          exit 1

      - name: Upload desktop assets to GitHub release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.sha256
          )

          if [ ${#assets[@]} -eq 0 ]; then
            echo "No desktop release assets were produced." >&2
            exit 1
          fi

          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Build native app bundle
        if: github.event_name == 'workflow_dispatch'
        run: bun run dist:desktop:dir

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: durabull-desktop-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.sha256
          if-no-files-found: error
